name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy,llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@4c6723ec9c638cccae824b8957c5085b695c8085 # v2.65.7
        with:
          tool: cargo-deny
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude galleria-gui --all-targets -- -D warnings
      - run: cargo test --workspace --exclude galleria-gui
      - run: cargo deny check
      - run: scripts/check-boundaries.sh
      - run: lab/tests/check-wsl.sh
      - run: bash lab/tests/build-user.sh

  coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy,llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@4c6723ec9c638cccae824b8957c5085b695c8085 # v2.65.7
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --exclude galleria-gui --summary-only

  lab:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [26, 27, 79]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy,llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: sudo modprobe wireguard
      - run: LAB_BUILD=host lab/run.sh ${{ matrix.client }}


  # DCO con il modulo `ovpn` del kernel (CONFIG_OVPN=m dalla 6.16, presente nel kernel -azure 7.0 del runner).
  # Solo OpenVPN 2.7 lo parla (2.7 ha tolto l'API di ovpn-dco-v2): per questo i client sono 27 e 79, non 26.
  # Il vecchio modulo fuori albero openvpn-dco-dkms non compila su kernel 7.0 (vedi docs/06-esito-fase1.md §4, S2).
  lab-dco:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [27, 79]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy,llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Load the in-kernel DCO module
        run: |
          uname -r
          sudo modprobe wireguard
          sudo modprobe ovpn
          lsmod | grep -E '^(ovpn|wireguard) '
          modinfo ovpn | head -n 5
      - run: GALLERIA_E2E_DCO=1 LAB_BUILD=host lab/run.sh ${{ matrix.client }} dco

  # G3 (plan B4, T6): the real window of the GUI imports the profiles of the laboratory and the real CLI and daemon on the
  # client list and connect them (crates/galleria-e2e/tests/t17_gui_import.rs). `lab` does not run t17 (lab/run.sh says so):
  # without the imported profiles it would pass by skipping itself, run 45735331757.
  # The window runs in the image of lab/images/gui.Dockerfile, as in `gui-smoke`: the runner is uid 1001, which the verb
  # handles, and the toolchain installed here is the one the image mounts. `ovpn` is not loaded: `lab` already connects
  # OpenVPN 2.7 on 27 and 79 without it (`cli_openvpn_with_password_stdin` of t16, run 45735331757), and `lab-dco` is
  # the one job that proves the module.
  lab-g3:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [26, 27, 79]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy,llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: sudo modprobe wireguard
      - run: LAB_BUILD=host scripts/gui.sh lab-g3 ${{ matrix.client }}

  # galleria-gui is outside check, coverage and lab/build.sh (they exclude it): it needs WebKitGTK and Node.
  # Locally the same steps run in the image built from lab/images/gui.Dockerfile: scripts/gui.sh check.
  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy,llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@4c6723ec9c638cccae824b8957c5085b695c8085 # v2.65.7
        with:
          tool: cargo-deny
      - name: Install the system libraries Tauri needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential curl wget file libwebkit2gtk-4.1-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global "pnpm@$(scripts/gui.sh pnpm-version)"
      - run: scripts/gui.sh check-here
      - run: scripts/tests/check-boundaries.sh
      - run: cargo deny check

  # Level 3 (spec §14, Q13): the real app in a WebKitGTK window under Xvfb, driven by tauri-driver and
  # WebKitWebDriver, against a fake daemon.
  # It runs in the same image as locally (`scripts/gui.sh smoke`, lab/images/gui.Dockerfile, Ubuntu 24.04), not on
  # the runner's own packages: `ubuntu-latest` moves to a new release and renames them (26.04 has no
  # `webkit2gtk-driver`, run 45638906906). The image gets the host Rust toolchain mounted, so it is installed here.
  gui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy,llvm-tools-preview
      - run: scripts/gui.sh smoke
