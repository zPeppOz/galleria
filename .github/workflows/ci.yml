name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy,llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@4c6723ec9c638cccae824b8957c5085b695c8085 # v2.65.7
        with:
          tool: cargo-deny
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude galleria-gui --all-targets -- -D warnings
      # the output is kept for scripts/check-gates.py (the last step): a proof that is ignored or missing must not pass as green
      - name: cargo test
        shell: bash
        run: |
          mkdir -p target/gates
          cargo test --workspace --exclude galleria-gui 2>&1 | tee target/gates/check-cargo.log
      - run: cargo deny check
      - run: scripts/check-boundaries.sh
      - run: lab/tests/check-wsl.sh
      - run: bash lab/tests/build-user.sh
      - run: scripts/tests/check-gates.sh
      - run: scripts/check-gates.py --job check --cargo-log target/gates/check-cargo.log

  coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy,llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@4c6723ec9c638cccae824b8957c5085b695c8085 # v2.65.7
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --exclude galleria-gui --summary-only

  lab:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [26, 27, 79]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy,llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: sudo modprobe wireguard
      - run: LAB_BUILD=host lab/run.sh ${{ matrix.client }}


  # DCO con il modulo `ovpn` del kernel (CONFIG_OVPN=m dalla 6.16, presente nel kernel -azure 7.0 del runner).
  # Solo OpenVPN 2.7 lo parla (2.7 ha tolto l'API di ovpn-dco-v2): per questo i client sono 27 e 79, non 26.
  # Il vecchio modulo fuori albero openvpn-dco-dkms non compila su kernel 7.0 (vedi docs/06-esito-fase1.md §4, S2).
  lab-dco:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [27, 79]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy,llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Load the in-kernel DCO module
        run: |
          uname -r
          sudo modprobe wireguard
          sudo modprobe ovpn
          lsmod | grep -E '^(ovpn|wireguard) '
          modinfo ovpn | head -n 5
      - run: GALLERIA_E2E_DCO=1 LAB_BUILD=host lab/run.sh ${{ matrix.client }} dco

  # G3 (plan B4, T6): the real window of the GUI imports the profiles of the laboratory and the real CLI and daemon on the
  # client list and connect them (crates/galleria-e2e/tests/t17_gui_import.rs). `lab` does not run t17 (lab/run.sh says so):
  # without the imported profiles it would pass by skipping itself, run 45735331757.
  # The window runs in the image of lab/images/gui.Dockerfile, as in `gui-smoke`: the runner is uid 1001, which the verb
  # handles, and the toolchain installed here is the one the image mounts. `ovpn` is not loaded: `lab` already connects
  # OpenVPN 2.7 on 27 and 79 without it (`cli_openvpn_with_password_stdin` of t16, run 45735331757), and `lab-dco` is
  # the one job that proves the module.
  lab-g3:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [26, 27, 79]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy,llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: sudo modprobe wireguard
      - run: LAB_BUILD=host scripts/gui.sh lab-g3 ${{ matrix.client }}

  # G4, G5, G6, G7 and G9 (plan B5, T9 and T10): the real window of the GUI, in the same image as `lab-g3`, drives the REAL daemon of the
  # client through a bridge of the host (lab/tests/gui-daemon-relay.py, Q42 (b)): connects, disconnects and replaces with WireGuard and
  # OpenVPN, asks for the credentials, saves them in a real GNOME Keyring, shows the session of another user of the group. The window
  # writes the results of its proofs to target/gui-lab/vitest.json and t18 (crates/galleria-e2e/tests/t18_gui_connect.rs) reads what the
  # client saw; the verb ends with scripts/check-gates.py, and so does this job, once more and alone: the 23 proofs of the manifests for
  # `lab-connect` must be in the log with `ok` or `passed`, none skipped or ignored. `lab` does not run t18 (lab/run.sh says so).
  # G10, the real tunnel with the window closed (plan B6, T6): `G10g_the_tunnel_survives_the_closed_window` (the window) and
  # `gui_closed_window_kept_the_tunnel` (t18) are among those 23, on each of the three clients.
  # No `continue-on-error`: a red proof is a red job. `ovpn` is not loaded here, as in `lab-g3`: `lab-dco` is the job that proves the module.
  lab-connect:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [26, 27, 79]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy,llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: sudo modprobe wireguard
      - run: LAB_BUILD=host scripts/gui.sh lab-connect ${{ matrix.client }}
      - run: scripts/check-gates.py --job lab-connect --vitest-json target/gui-lab/vitest.json --cargo-log target/gates/lab-connect-cargo.log

  # galleria-gui is outside check, coverage and lab/build.sh (they exclude it): it needs WebKitGTK and Node.
  # Locally the same steps run in the image built from lab/images/gui.Dockerfile: scripts/gui.sh check.
  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy,llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: taiki-e/install-action@4c6723ec9c638cccae824b8957c5085b695c8085 # v2.65.7
        with:
          tool: cargo-deny
      - name: Install the system libraries Tauri needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential curl wget file libwebkit2gtk-4.1-dev \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global "pnpm@$(scripts/gui.sh pnpm-version)"
      - run: scripts/gui.sh check-here
      - run: scripts/tests/check-boundaries.sh
      - run: cargo deny check
      # G7 and G9 of the level 2 (plan B5, T10) and G11 (plan B6, T6: the four `update_*` tests, the version check against a server that counts): `check-here` keeps the output of `cargo test -p galleria-gui` in target/gates/gui-cargo.log, and
      # the proofs that close those gates must be in it with `ok`, not skipped or missing
      - run: scripts/check-gates.py --job gui --cargo-log target/gates/gui-cargo.log

  # Level 3 (spec §14, Q13): the real app in a WebKitGTK window under Xvfb, driven by tauri-driver and
  # WebKitWebDriver, against a fake daemon.
  # It runs in the same image as locally (`scripts/gui.sh smoke`, lab/images/gui.Dockerfile, Ubuntu 24.04), not on
  # the runner's own packages: `ubuntu-latest` moves to a new release and renames them (26.04 has no
  # `webkit2gtk-driver`, run 45638906906). The image gets the host Rust toolchain mounted, so it is installed here.
  gui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy,llvm-tools-preview
      - run: scripts/gui.sh smoke
      # The owner check of the single-instance socket against two real users (lab/tests/gui-socket-owner.sh). It counts its checks
      # and ends with an error if one was skipped, so it cannot be green without running.
      - run: scripts/gui.sh socket-owner
      # GNOME Keyring unlocked, locked, absent and without a default collection: the keyring store and the CLI on it (lab/tests/gui-keyring.sh, plan B5, T2).
      # The tests are `#[ignore]` for `cargo test`, fail under the wrong case, and the check at the end wants each of them with
      # `ok` in the log: a round that ran nothing is red.
      - run: scripts/gui.sh keyring
      # The last step of the job: every proof of the manifests for `gui-smoke` must be in the output with `ok` or `passed`, none skipped or missing.
      # The cargo ones are the keyring (G5, G6, the three logs above); the vitest ones are the smoke test of this very job, which kept its results in
      # target/gates/smoke-vitest.json (plan B6, T6): G10a–G10f, the tray and the closing of the window, and G11a, the version check of the app built
      # as for a release. No `--kind`: until B6 this step looked at the cargo ones only, and the proofs of the smoke test could be skipped unseen.
      - run: scripts/check-gates.py --job gui-smoke --vitest-json target/gates/smoke-vitest.json --cargo-log target/gates/keyring-unlocked.log --cargo-log target/gates/keyring-locked.log --cargo-log target/gates/keyring-absent.log --cargo-log target/gates/keyring-nodefault.log
