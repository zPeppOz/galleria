[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
rust-version = "1.96"

[workspace.dependencies]
galleria-ipc = { path = "crates/galleria-ipc" }
galleria-backend = { path = "crates/galleria-backend" }
galleria-net = { path = "crates/galleria-net" }
ipnet = "2"
uuid = { version = "1", features = ["v4"] }
rstest = "0.26"
proptest = "1"
tempfile = "3"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rustix = { version = "1", features = ["process", "fs"] }
nix = { version = "0.31", features = ["user"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread", "sync", "time", "net", "signal", "test-util"] }
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
