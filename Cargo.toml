[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
rust-version = "1.96"

[workspace.dependencies]
galleria-ipc = { path = "crates/galleria-ipc" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
