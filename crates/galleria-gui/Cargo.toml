[package]
name = "galleria-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Galleria desktop GUI (Rust side of the Tauri app)"

[features]
# Set by the Tauri CLI for release builds: embed ui/dist instead of loading the dev server.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
anyhow.workspace = true
galleria-ipc = { workspace = true, features = ["client"] }
nix.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
thiserror.workspace = true
tokio.workspace = true

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

# The fake daemon of the level-2 tests (spec §14, Q17): the daemon and the fake backend are never normal dependencies.
[dev-dependencies]
galleria-backend = { workspace = true, features = ["fake"] }
galleriad = { path = "../galleriad" }
rstest.workspace = true
tauri = { version = "2.12", features = ["test"] }
tempfile.workspace = true
tokio-util.workspace = true

[lints]
workspace = true
