[package]
name = "galleria-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Galleria desktop GUI (Rust side of the Tauri app)"

[features]
# Set by the Tauri CLI for release builds: embed ui/dist instead of loading the dev server.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
galleria-ipc = { workspace = true, features = ["client"] }
# The rubrica reads the same store as the CLI (plan B3). The parser of the OpenVPN text is the one the profile crate
# already uses; neither is a backend and neither reaches the daemon.
galleria-ovpn = { path = "../galleria-ovpn" }
galleria-profile = { path = "../galleria-profile" }
ipnet.workspace = true
nix.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
tempfile.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
toml.workspace = true
uuid.workspace = true

# Only for the screen reader announcement (Q27): the same `gtk` 0.18 that Tauri brings, so it adds no crate and no
# version to Cargo.lock. `glib` and `atk` are used through it (`gtk::glib`, `gtk::atk`), never as direct dependencies.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

# The fake daemon of the level-2 tests (spec §14, Q17): the daemon and the fake backend are never normal dependencies.
[dev-dependencies]
galleria-backend = { workspace = true, features = ["fake"] }
# Only to prove that what the window accepts for a WireGuard profile is what the daemon accepts (plan B3, P8).
galleria-backend-wireguard = { path = "../galleria-backend-wireguard" }
galleriad = { path = "../galleriad" }
rstest.workspace = true
tauri = { version = "2.12", features = ["test"] }
tokio-util.workspace = true

[lints]
workspace = true
