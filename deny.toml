[advisories]
# Every entry names the advisory and says why it is accepted; the category is never switched off.
ignore = [
    # `proc-macro-error` is unmaintained, with no safe upgrade. It is a compile-time proc-macro dependency of the
    # GTK3 Rust bindings (`glib-macros`, `gtk3-macros`) that Tauri and wry use on Linux, so it never runs in the
    # shipped binary. Revisit when Tauri moves off GTK3.
    { id = "RUSTSEC-2024-0370", reason = "build-time proc-macro of the GTK3 bindings under Tauri; no safe upgrade" },
    # `glib` 0.18 is unsound in `glib::VariantStrIter` (fixed in glib 0.20). It is the GTK3 binding that Tauri, tao and
    # wry use on Linux; no safe upgrade exists while Tauri stays on GTK3. Galleria depends on no glib crate directly
    # (`cargo tree -i glib`: only through tauri and `gtk`, which `galleria-gui` names for the screen reader
    # announcement only and uses through `gtk::glib`), and no crate in the tree outside glib itself calls
    # `VariantStrIter` or the glib `Variant` string-array API: the announcement passes a string and an integer.
    # Revisit when Tauri moves off GTK3.
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18 of the GTK3 bindings under Tauri; VariantStrIter is not used by us or by the tree" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    # Apache-2.0 plus an exception that only relaxes it (target-lexicon, via Tauri's system-deps); compatible with
    # GPL-3.0-or-later like plain Apache-2.0.
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "LGPL-2.1-or-later",
    "GPL-3.0-or-later",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
