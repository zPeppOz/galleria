[package]
name = "galleriad-spike"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Spike 2 (throwaway): drive openvpn 2.6/2.7 only through the management interface"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
libc = "0.2"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }

[profile.release]
strip = true
