# Server OpenVPN di prova, variante: DNS spinto con l'opzione "dns" (2.6+) invece di "dhcp-option"
port 1194
proto udp
dev tun0
ca /pki/ca.crt
cert /pki/server.crt
key /pki/server.key
dh none
tls-auth /pki/ta.key 0
topology subnet
server 10.9.0.0 255.255.255.0
push "dns server 0 address 10.9.0.1"
push "dns search-domains galleria.test"
push "route 192.0.2.0 255.255.255.0"
push "redirect-gateway def1"
keepalive 10 60
script-security 2
auth-user-pass-verify /etc/openvpn/lab/verify.sh via-file
verb 3
