# Server OpenVPN di prova (laboratorio Galleria, spike 2)
port 1194
proto udp
dev tun0
ca /pki/ca.crt
cert /pki/server.crt
key /pki/server.key
dh none
tls-auth /pki/ta.key 0
topology subnet
server 10.8.0.0 255.255.255.0
# Opzioni spinte al client (criteri 2.7 e 2.8)
push "dhcp-option DNS 10.8.0.1"
push "dhcp-option DOMAIN galleria.test"
push "route 192.0.2.0 255.255.255.0"
push "redirect-gateway def1"
keepalive 10 60
script-security 2
auth-user-pass-verify /etc/openvpn/lab/verify.sh via-file
verb 3
