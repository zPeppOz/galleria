[package]
name = "galleriad"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Spike 1 (throwaway): Windows service that brings up a WireGuard tunnel with WireGuardNT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
wireguard-nt = "0.5"
windows-service = "0.8"
ipnet = "2"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO"] }

[profile.release]
strip = true
